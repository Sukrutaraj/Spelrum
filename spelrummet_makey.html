<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Spelrummet – MakeyMakey</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;background:#0a140a;color:#f0f0f0;}
#bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 25% 45%,#0a1f0a 0%,#0a140a 65%);}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:0.11;animation:orbf linear infinite alternate;}
@keyframes orbf{from{transform:translate(0,0);}to{transform:translate(35px,-25px);}}
.view{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;}
.view.active{display:flex;}
.top-bar{flex-shrink:0;display:flex;align-items:center;padding:clamp(8px,1.5vh,16px) clamp(12px,2vw,24px);gap:12px;background:rgba(0,0,0,0.35);border-bottom:1px solid rgba(255,255,255,0.06);}
.back-btn{font-family:'Trebuchet MS','Arial Rounded MT Bold',system-ui,sans-serif;font-size:15px;border:none;border-radius:8px;background:rgba(255,255,255,0.09);color:#e0e0f0;padding:7px 16px;cursor:pointer;transition:background .15s;white-space:nowrap;-webkit-tap-highlight-color:transparent;}
.back-btn:hover{background:rgba(255,255,255,0.18);}
.home-btn{font-family:'Trebuchet MS','Arial Rounded MT Bold',system-ui,sans-serif;font-size:15px;border:none;border-radius:8px;background:rgba(34,197,94,0.15);color:#22c55e;padding:7px 16px;cursor:pointer;transition:background .15s;white-space:nowrap;text-decoration:none;display:flex;align-items:center;}
.home-btn:hover{background:rgba(34,197,94,0.25);}
.bar-title{font-family:'Trebuchet MS','Arial Rounded MT Bold',system-ui,sans-serif;font-size:clamp(14px,2vw,20px);letter-spacing:2px;flex:1;}
#viewCats .top-bar{border-bottom:none;background:transparent;}
.hub-title{font-family:'Trebuchet MS','Arial Rounded MT Bold',system-ui,sans-serif;font-size:clamp(22px,4vw,50px);letter-spacing:3px;background:linear-gradient(135deg,#22c55e,#86efac,#4ade80);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;}
.key-display{display:flex;justify-content:center;align-items:center;gap:6px;flex-shrink:0;padding:8px 0 4px;flex-wrap:wrap;}
.key{background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.3);border-radius:8px;padding:4px 10px;font-size:clamp(12px,1.8vw,16px);font-family:'Trebuchet MS','Arial Rounded MT Bold',system-ui,sans-serif;letter-spacing:1px;color:#22c55e;}
.cat-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,1.8vh,18px);padding:clamp(10px,1.5vh,20px) clamp(16px,4vw,40px);-webkit-overflow-scrolling:touch;}
.cat-btn{width:100%;max-width:500px;display:flex;align-items:center;gap:clamp(14px,2.5vw,24px);padding:clamp(14px,2.2vh,24px) clamp(18px,3vw,32px);border-radius:20px;cursor:pointer;border:2px solid transparent;transition:transform .16s,box-shadow .16s;-webkit-tap-highlight-color:transparent;user-select:none;}
.cat-btn:hover,.cat-btn:active{transform:scale(1.03) translateY(-2px);box-shadow:0 10px 35px rgba(0,0,0,0.5);}
.cat-btn-icon{font-size:clamp(30px,5vw,52px);line-height:1;flex-shrink:0;}
.cat-btn-name{font-family:'Trebuchet MS','Arial Rounded MT Bold',system-ui,sans-serif;font-size:clamp(18px,2.8vw,30px);letter-spacing:2px;}
.cat-btn-count{font-size:clamp(11px,1.4vw,14px);opacity:0.65;margin-top:2px;}
.games-scroll{flex:1;overflow-y:auto;padding:clamp(12px,2vh,22px) clamp(12px,2vw,28px);-webkit-overflow-scrolling:touch;}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(130px,16vw,200px),1fr));gap:clamp(10px,1.8vw,18px);}
.game-card{position:relative;background:rgba(255,255,255,0.05);border:1.5px solid rgba(255,255,255,0.08);border-radius:16px;padding:clamp(12px,2vh,20px) 10px;cursor:pointer;text-align:center;transition:transform .15s,background .15s,box-shadow .15s;display:flex;flex-direction:column;align-items:center;gap:6px;-webkit-tap-highlight-color:transparent;user-select:none;}
.game-card:hover,.game-card:active{transform:scale(1.05) translateY(-3px);background:rgba(255,255,255,0.1);box-shadow:0 8px 28px rgba(0,0,0,0.5);}
.card-emoji{font-size:clamp(28px,4.5vw,52px);line-height:1;transition:transform .2s;}
.game-card:hover .card-emoji{transform:scale(1.18) rotate(-4deg);}
.card-name{font-family:'Trebuchet MS','Arial Rounded MT Bold',system-ui,sans-serif;font-size:clamp(12px,1.6vw,16px);letter-spacing:1px;}
.card-desc{font-size:clamp(9px,1vw,11px);color:#2a5a2a;line-height:1.3;}
.card-new{position:absolute;top:5px;right:5px;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:7px;letter-spacing:1px;}
.card-del{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;background:rgba(220,38,38,0.85);border:none;color:white;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:1;z-index:10;-webkit-tap-highlight-color:transparent;box-shadow:0 2px 8px rgba(0,0,0,0.4);}
.card-del:hover{background:#dc2626;}
#viewGame .top-bar{background:rgba(0,0,0,0.92);}
#gameFrame{flex:1;border:none;width:100%;background:#000;}
#homeBtn{position:fixed;bottom:12px;left:12px;z-index:200;font-size:13px;font-weight:700;border:none;border-radius:8px;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.7);padding:6px 14px;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:6px;transition:background .15s;-webkit-tap-highlight-color:transparent;}
#homeBtn:hover{background:rgba(255,255,255,0.2);}
#staffBtn{position:fixed;top:10px;right:10px;z-index:200;font-size:13px;font-weight:700;
  border:none;border-radius:8px;background:rgba(255,255,255,0.08);
  color:rgba(255,255,255,0.5);padding:6px 12px;cursor:pointer;
  transition:all .15s;-webkit-tap-highlight-color:transparent;}
#staffBtn.active{background:rgba(239,68,68,0.2);color:#f87171;border:1px solid rgba(239,68,68,0.3);}
#staffBtn:hover{background:rgba(255,255,255,0.15);}
</style>
</head>
<body>

<a id="homeBtn" href="index.html">🏠 Spelrummet</a>
<button id="staffBtn" onclick="toggleStaff()">🔑 Personal</button>

<div id="bg">
  <div class="orb" style="width:600px;height:600px;background:#059669;top:-150px;left:-150px;animation-duration:17s;"></div>
  <div class="orb" style="width:500px;height:500px;background:#0d9488;bottom:-100px;right:-100px;animation-duration:21s;animation-delay:-9s;"></div>
  <div class="orb" style="width:350px;height:350px;background:#1d4ed8;top:38%;left:38%;animation-duration:14s;animation-delay:-5s;"></div>
</div>

<!-- VIEW 1: CATEGORIES -->
<div class="view active" id="viewCats">
  <div class="top-bar" style="justify-content:space-between;">
    <div style="text-align:left;">
      <div class="hub-title" style="font-size:clamp(16px,2.5vw,28px);">🕹️ MAKEY MAKEY</div>
    </div>
  </div>
  <div class="key-display">
    <span class="key">↑ Upp</span>
    <span class="key">↓ Ned</span>
    <span class="key">← Vänster</span>
    <span class="key">→ Höger</span>
    <span class="key">⎵ Mellanslag</span>
    <span class="key">↵ Enter</span>
  </div>
  <div class="cat-scroll" id="catList"></div>
</div>

<!-- VIEW 2: GAME GRID -->
<div class="view" id="viewGames">
  <div class="top-bar">
    <button class="back-btn" onclick="showCats()">← Kategorier</button>
    <span class="bar-title" id="gamesBarTitle"></span>
  </div>
  <div class="games-scroll"><div class="cards-grid" id="gameList"></div></div>
</div>

<!-- VIEW 3: GAME FRAME -->
<div class="view" id="viewGame">
  <div class="top-bar">
    <button class="back-btn" onclick="closeGame()">← Meny</button>
    <span class="bar-title" id="gameBarTitle"></span>
  </div>
  <iframe id="gameFrame" allowfullscreen></iframe>
</div>


<div id="uploadModal" style="display:none;position:fixed;inset:0;z-index:999;
  background:rgba(0,0,0,0.88);align-items:center;justify-content:center;padding:20px;">
  <div style="background:#0a1a0a;border:1.5px solid rgba(34,197,94,0.3);border-radius:20px;
    padding:28px 24px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;">
    <div id="modalTitle" style="font-size:clamp(16px,3vw,22px);font-weight:900;color:#fff;text-align:center;"></div>
    <div style="font-size:13px;color:#666;text-align:center;">Ange lösenord för att lägga till spel</div>
    <input type="password" id="modalPwd" placeholder="Lösenord"
      style="background:rgba(255,255,255,0.07);border:1.5px solid rgba(255,255,255,0.12);
        border-radius:10px;padding:12px 14px;font-size:16px;color:#fff;
        outline:none;font-family:inherit;width:100%;">
    <div style="display:flex;gap:10px;">
      <button onclick="submitUploadModal()"
        style="flex:1;font-weight:700;font-size:15px;border:none;border-radius:10px;
          padding:12px;cursor:pointer;background:linear-gradient(135deg,#059669,#34d399);color:#fff;">
        ✅ Gå vidare
      </button>
      <button onclick="closeUploadModal()"
        style="font-weight:700;font-size:15px;border:none;border-radius:10px;
          padding:12px 16px;cursor:pointer;background:rgba(255,255,255,0.08);color:#ccc;">✕</button>
    </div>
    <div id="modalErr" style="color:#f87171;font-size:13px;text-align:center;min-height:18px;"></div>
  </div>
</div>

let currentBlob = null;
let currentCat  = null;

function buildCats(){
  const list = document.getElementById('catList');
  list.innerHTML = '';

  CATEGORIES.forEach(function(cat){
    const games = GAMES.filter(function(g){ return g.category===cat.id && !hiddenGames.has(g.id); });
    const allowEmpty = cat.id==='deltagarspel' || cat.id==='webb';
    if(games.length===0 && !allowEmpty) return;

    const btn = document.createElement('div');
    btn.className = 'cat-btn';
    btn.style.background = cat.bg;
    btn.style.borderColor = cat.color+'44';
    const count = games.length;
    btn.innerHTML =
      '<div class="cat-btn-icon">'+cat.icon+'</div>'+
      '<div>'+
        '<div class="cat-btn-name" style="color:'+cat.color+'">'+cat.name+'</div>'+
        '<div class="cat-btn-count">'+cat.desc+(count?' &nbsp;·&nbsp; '+count+' spel':' &nbsp;·&nbsp; Inga spel ännu')+'</div>'+
      '</div>';
    btn.addEventListener('click',function(){ showGames(cat); });
    btn.addEventListener('touchend',function(e){ e.preventDefault(); showGames(cat); });
    list.appendChild(btn);
  });

  // Checklist link
  var how = document.createElement('a');
  how.href = 'https://sukrutaraj.github.io/checklist-pages/checklist-1788262633006.html';
  how.target = '_blank';
  how.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:8px;'+
    'background:rgba(34,197,94,0.08);border:1.5px solid rgba(34,197,94,0.25);'+
    'border-radius:16px;padding:14px 18px;text-decoration:none;cursor:pointer;'+
    'transition:background .15s;width:100%;max-width:500px;';
  how.innerHTML =
    '<div style="font-size:22px;">📋</div>'+
    '<div style="font-size:15px;font-weight:700;color:#4ade80;">Hur skapar man ett spel?</div>'+
    '<div style="font-size:12px;color:#555;text-align:center;">Steg-för-steg checklistan</div>';
  list.appendChild(how);
}

function showGames(cat){
  currentCat = cat;
  const games = GAMES.filter(function(g){ return g.category===cat.id; });
  const grid  = document.getElementById('gameList');
  grid.innerHTML = '';

  games.forEach(function(g){
    var card = document.createElement('div');
    card.className = 'game-card';
    card.style.borderColor = cat.color+'30';
    var isDeltagar = g.category==='deltagarspel';
    var folder = isDeltagar ? 'deltagarspel_makey' : '';
    card.innerHTML =
      (g.isNew?'<div class="card-new">NY!</div>':'')+
      '<div class="card-emoji">'+g.emoji+'</div>'+
      '<div class="card-name" style="color:'+cat.color+'">'+g.name+'</div>'+
      '<div class="card-desc">'+g.desc+'</div>'+
      (staffMode ? '<button class="card-del" title="Ta bort">🗑</button>' : '');
    card.addEventListener('click', function(e){
      if(e.target.classList.contains('card-del')) return;
      openGame(g);
    });
    card.addEventListener('touchend', function(e){
      if(e.target.classList.contains('card-del')) return;
      e.preventDefault(); openGame(g);
    });
    var delBtn = card.querySelector('.card-del');
    if(delBtn){
      delBtn.addEventListener('pointerdown', function(e){
        e.stopPropagation(); e.preventDefault();
        if(isDeltagar){
          deleteGame(g.id, folder, g.file||'');
        } else {
          // Built-in game: hide locally until page reload
          if(confirm('Dölj "'+g.name+'" från listan? (Syns igen vid omladdning)')){
            hiddenGames.add(g.id);
            showGames(currentCat);
          }
        }
      });
    }
    grid.appendChild(card);
  });

  // Add button
  var add = document.createElement('div');
  add.className = 'game-card';
  add.style.cssText = 'cursor:pointer;border-color:'+cat.color+'40;border-style:dashed;background:rgba(255,255,255,0.03);';
  add.innerHTML =
    '<div class="card-emoji" style="font-size:clamp(24px,4vw,42px);opacity:0.5;">➕</div>'+
    '<div class="card-name" style="color:'+cat.color+';opacity:0.7;">Lägg till spel</div>'+
    '<div class="card-desc" style="color:#555;">Ladda upp ett spel</div>';
  add.addEventListener('click', function(){ showUploadModal(cat); });
  add.addEventListener('touchend', function(e){ e.preventDefault(); showUploadModal(cat); });
  grid.appendChild(add);

  var title = document.getElementById('gamesBarTitle');
  title.textContent = cat.icon+' '+cat.name;
  title.style.color = cat.color;
  setView('viewGames');
}

function openGame(g){
  if(g.url){ window.open(g.url,'_blank'); return; }
  var b64 = GAME_B64[g.id] || g.b64;
  if(!b64){ alert('Spelet saknas!'); return; }
  var html = decodeURIComponent(escape(atob(b64)));
  if(currentBlob) URL.revokeObjectURL(currentBlob);
  var blob = new Blob([html],{type:'text/html;charset=utf-8'});
  currentBlob = URL.createObjectURL(blob);
  document.getElementById('gameBarTitle').textContent = g.emoji+' '+g.name;
  document.getElementById('gameFrame').src = currentBlob;
  setView('viewGame');
}

function closeGame(){
  document.getElementById('gameFrame').src='about:blank';
  if(currentBlob){URL.revokeObjectURL(currentBlob);currentBlob=null;}
  setView('viewGames');
}

function showCats(){ setView('viewCats'); }

function setView(id){
  document.querySelectorAll('.view').forEach(function(v){
    v.classList.toggle('active', v.id===id);
  });
}


var _uploadCat = null;
var _UPLOAD_HASH = '705';
function showUploadModal(cat){
  _uploadCat = cat;
  var title = document.getElementById('modalTitle');
  if(title) title.textContent = '➕ Lägg till i ' + cat.name;
  var pwd = document.getElementById('modalPwd');
  if(pwd){ pwd.value=''; setTimeout(function(){pwd.focus();},150); }
  var err = document.getElementById('modalErr');
  if(err) err.textContent='';
  document.getElementById('uploadModal').style.display='flex';
}
function closeUploadModal(){
  document.getElementById('uploadModal').style.display='none';
  _uploadCat = null;
}
function submitUploadModal(){
  var pwd = document.getElementById('modalPwd').value;
  var h = String(pwd.split('').reduce(function(a,ch){return a+ch.charCodeAt(0);},0));
  if(h !== _UPLOAD_HASH){
    document.getElementById('modalErr').textContent='❌ Fel lösenord!';
    document.getElementById('modalPwd').value='';
    return;
  }
  closeUploadModal();
  var param = _uploadCat ? '?cat='+_uploadCat.id : '';
  window.location.href = 'ladda_upp.html' + param;
}
(function(){
  var inp = document.getElementById('modalPwd');
  if(inp) inp.addEventListener('keydown',function(e){if(e.key==='Enter')submitUploadModal();});
})();

/* ── Delete deltagarspel ── */
var DEL_OBF  = [53,7,28,54,5,7,4,118,87,39,44,88,94,22,120,127,6,85,97,40,56,31,63,100,0,104,98,101,42,88,93,87,105,85,3,5,98,1,5,49];
var DEL_HASH = '705';
function delDecodeToken(pwd){
  return DEL_OBF.map(function(b,i){ return String.fromCharCode(b^pwd.charCodeAt(i%pwd.length)); }).join('');
}
function delCheckPwd(pwd){
  var h=String(pwd.split('').reduce(function(a,c){return a+c.charCodeAt(0);},0));
  return h===DEL_HASH;
}
function deleteGame(gameId,folder,filename){
  if(!filename){alert('Filnamn saknas.');return;}
  var pwd=prompt('Ange lösenord för att ta bort spelet:');
  if(!pwd) return;
  if(!delCheckPwd(pwd)){alert('Fel lösenord!');return;}
  if(!confirm('Ta bort spelet permanent?')) return;
  var token=delDecodeToken(pwd);
  var REPO='sukrutaraj/Spelrum';
  var BRANCH='main';
  function getFileSHA(path){
    return fetch('https://api.github.com/repos/'+REPO+'/contents/'+path+'?ref='+BRANCH,{
      headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}
    }).then(function(r){return r.ok?r.json():null;})
      .then(function(d){return d?d.sha:null;})
      .catch(function(){return null;});
  }
  function deleteFile(path){
    return getFileSHA(path).then(function(sha){
      if(!sha) return;
      return fetch('https://api.github.com/repos/'+REPO+'/contents/'+path,{
        method:'DELETE',
        headers:{'Authorization':'token '+token,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},
        body:JSON.stringify({message:'Ta bort: '+filename,sha:sha,branch:BRANCH})
      });
    });
  }
  deleteFile(folder+'/'+filename)
  .then(function(){
    return fetch('https://api.github.com/repos/'+REPO+'/contents/'+folder+'?ref='+BRANCH,{
      headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}
    });
  })
  .then(function(r){return r.ok?r.json():[];})
  .then(function(files){
    var base=filename.replace('.html','').replace(/_[0-9]+$/,'');
    var meta=files.find(function(f){return f.name.startsWith('meta_')&&f.name.indexOf(base)>=0;});
    if(meta) return deleteFile(folder+'/'+meta.name);
  })
  .then(function(){
    alert('Spelet har tagits bort!');
    var idx=GAMES.findIndex(function(g){return g.id===gameId;});
    if(idx>=0){GAMES.splice(idx,1);delete GAME_B64[gameId];}
    if(currentCat) showGames(currentCat);
  })
  .catch(function(e){alert('Kunde inte ta bort: '+e.message);});
}

/* ── Fetch deltagarspel from GitHub ── */
async function fetchDeltagar(folder){
  var REPO='sukrutaraj/Spelrum';
  var BASE='https://raw.githubusercontent.com/'+REPO+'/main/';
  var API='https://api.github.com/repos/'+REPO+'/contents/'+folder+'?ref=main';
  try{
    var res=await fetch(API,{headers:{'Accept':'application/vnd.github.v3+json'}});
    if(!res.ok) return;
    var files=await res.json();
    if(!Array.isArray(files)) return;
    var metaFiles=files.filter(function(f){return f.name.startsWith('meta_')&&f.name.endsWith('.json');});
    for(var mf of metaFiles){
      try{
        var mr=await fetch(BASE+folder+'/'+mf.name);
        if(!mr.ok) continue;
        var meta=await mr.json();
        var gid=mf.name.replace('.json','');
        if(GAMES.find(function(g){return g.id===gid;})) continue;
        var htmlFile=files.find(function(f){return f.name===meta.file;});
        if(!htmlFile) continue;
        var hr=await fetch(BASE+folder+'/'+meta.file);
        if(!hr.ok) continue;
        var htmlContent=await hr.text();
        GAME_B64[gid]=btoa(unescape(encodeURIComponent(htmlContent)));
        GAMES.push({id:gid,name:meta.name,emoji:meta.emoji||'🎮',desc:meta.desc||meta.name,
          category:'deltagarspel',cat:meta.cat||'makey',file:meta.file||'',isNew:true});
      }catch(e){console.warn('Spel ej laddat:',mf.name,e);}
    }
    if(currentCat&&currentCat.id==='deltagarspel') showGames(currentCat);
    else buildCats();
  }catch(e){console.warn('GitHub fetch failed:',e);}
}
