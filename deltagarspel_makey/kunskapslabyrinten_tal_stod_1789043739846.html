/* ---------- RÖST / TALSYNTES (tillgänglighet) ---------- */

const voiceBtn = document.getElementById("voiceBtn");

let voiceOn = true;        // rösten är på från början
let primed = false;        // webbläsare kräver ett första tangenttryck innan ljud
let svVoice = null;        // svensk röst om en finns

function pickVoice(){
    if(!("speechSynthesis" in window)) return;
    const vs = speechSynthesis.getVoices();
    // föredra en svensk röst, annars första bästa
    svVoice = vs.find(v => v.lang && v.lang.toLowerCase().startsWith("sv")) || null;
}
if("speechSynthesis" in window){
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;
}

/* Säg en mening. cancel=true avbryter pågående tal (annars läggs det i kö). */
function speakRaw(text, cancel){
    if(!voiceOn || !("speechSynthesis" in window) || !text) return;
    try{
        if(cancel) speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "sv-SE";
        if(svVoice) u.voice = svVoice;
        u.rate = 0.98;   // en aning lugnare för tydlighet
        u.pitch = 1.0;
        speechSynthesis.speak(u);
    }catch(e){}
}
function speak(text){ speakRaw(text, true); }   // avbryter och säger nytt

function dirWord(dx, dy){
    if(dx === 1)  return "höger";
    if(dx === -1) return "vänster";
    if(dy === -1) return "uppåt";
    if(dy === 1)  return "neråt";
    return "";
}

/* Räknar ut nästa vägledning: riktning + antal steg, och varnar för port/mål. */
function computeInstruction(){
    if(!running || questionActive || gameWon || gameOver || levelCleared) return null;
    const path = findPath(player, exit);
    if(path.length < 2) return null;

    const a = path[0], b = path[1];
    const dx = b.x - a.x, dy = b.y - a.y;
    const dir = dirWord(dx, dy);

    // Är allra första steget en port?
    if(map[b.y][b.x] === 3){
        return "Porten är ett steg " + dir + ". Tryck " + dir +
               " för att läsa frågan.";
    }

    // Räkna rakt fram i samma riktning tills det svänger, kommer en port, eller mål.
    let steps = 0;
    let i = 0;
    let endType = "turn";
    while(i + 1 < path.length){
        const c = path[i], n = path[i + 1];
        const ndx = n.x - c.x, ndy = n.y - c.y;
        if(ndx !== dx || ndy !== dy){ endType = "turn"; break; }
        if(map[n.y][n.x] === 3){ endType = "door"; break; }  // stanna före porten
        steps++;
        if(n.x === exit.x && n.y === exit.y){ endType = "exit"; break; }
        i++;
    }

    let text = "Gå " + dir + ", " + steps + " steg.";
    if(endType === "door")      text += " Sedan kommer en port med en fråga.";
    else if(endType === "exit") text += " Sedan är du i mål.";
    return text;
}

function announceGuidance(){
    speak(computeInstruction());
}

function announceLevelStart(){
    if(!primed) return;   // inget ljud förrän användaren tryckt en knapp
    const cfg = levels[level - 1];
    speakRaw("Nivå " + level + ", " + cfg.name + ". " +
             cfg.doors + " portar att öppna. Du har " + lives +
             " liv. Lycka till.", true);
    const ins = computeInstruction();
    if(ins) speakRaw(ins, false);   // läggs i kö efter introt
}

function speakQuestion(q){
    speak("Port! Fråga: " + q.question +
          ". Svarsalternativ. Pil upp: " + q.answers[0] +
          ". Pil ner: " + q.answers[1] +
          ". Mellanslag: " + q.answers[2] +
          ". Tryck pil höger för att höra frågan igen.");
}

function repeatQuestion(){
    if(!currentQuestion) return;
    const q = currentQuestion;
    speak("Frågan igen. " + q.question +
          ". Pil upp: " + q.answers[0] +
          ". Pil ner: " + q.answers[1] +
          ". Mellanslag: " + q.answers[2] + ".");
}

function toggleVoice(){
    voiceOn = !voiceOn;
    voiceBtn.textContent = voiceOn ? "🔊 Röst på" : "🔇 Röst av";
    if(!voiceOn){
        if("speechSynthesis" in window) speechSynthesis.cancel();
    } else {
        primed = true;
        announceGuidance();
    }
    voiceBtn.blur();   // så mellanslag inte råkar trycka på knappen
}
voiceBtn.addEventListener("click", toggleVoice);


/* ---------- FRÅGOR I TRE SVÅRIGHETSNIVÅER ---------- */

];


function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}


/* ---------- LABYRINT ---------- */

function generateMaze(){

    map = [];
    for(let y = 0; y < rows; y++){
        map[y] = [];
        for(let x = 0; x < cols; x++) map[y][x] = 1;
    }

    const stack = [];
    map[1][1] = 0;
    stack.push({ x: 1, y: 1 });

    const dirs = [
        { x: 0, y: -2 }, { x: 0, y: 2 },
        { x: -2, y: 0 }, { x: 2, y: 0 }
    ];

    while(stack.length){
        const cur = stack[stack.length - 1];
        const neighbors = [];
        for(const d of dirs){
            const nx = cur.x + d.x;
            const ny = cur.y + d.y;
            if(nx > 0 && ny > 0 && nx < cols - 1 && ny < rows - 1 && map[ny][nx] === 1){
                neighbors.push({ x: nx, y: ny, wx: cur.x + d.x / 2, wy: cur.y + d.y / 2 });
            }
        }
        if(neighbors.length){
            const n = neighbors[Math.floor(Math.random() * neighbors.length)];
            map[n.wy][n.wx] = 0;
            map[n.y][n.x] = 0;
            stack.push({ x: n.x, y: n.y });
        } else {
            stack.pop();
        }
    }

    player = { x: 1, y: 1 };
    exit = { x: cols - 2, y: rows - 2 };
    map[player.y][player.x] = 0;
    map[exit.y][exit.x] = 0;
}

function findPath(start, end){
    const key = (x, y) => x + "_" + y;
    const queue = [start];
    const came = {};
    const seen = new Set([key(start.x, start.y)]);
    const dirs = [
        { x: 0, y: -1 }, { x: 0, y: 1 },
        { x: -1, y: 0 }, { x: 1, y: 0 }
    ];
    let found = false;

    while(queue.length){
        const c = queue.shift();
        if(c.x === end.x && c.y === end.y){ found = true; break; }
        for(const d of dirs){
            const nx = c.x + d.x;
            const ny = c.y + d.y;
            if(nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
            if(map[ny][nx] === 1) continue;
            const k = key(nx, ny);
            if(seen.has(k)) continue;
            seen.add(k);
            came[k] = { x: c.x, y: c.y };
            queue.push({ x: nx, y: ny });
        }
    }

    if(!found) return [];
    const path = [];
    let cur = { x: end.x, y: end.y };
    while(!(cur.x === start.x && cur.y === start.y)){
        path.push(cur);
        cur = came[key(cur.x, cur.y)];
    }
    path.push(start);
    path.reverse();
    return path;
}

function placeDoors(doorCount, pool){
    doors = [];
    const path = findPath(player, exit);
    const interior = path.slice(1, path.length - 1);
    const count = Math.min(doorCount, interior.length, pool.length);
    const qOrder = shuffle([...Array(pool.length).keys()]).slice(0, count);
    const usedIdx = new Set();

    for(let i = 0; i < count; i++){
        let idx = Math.round((i + 1) * interior.length / (count + 1));
        if(idx < 0) idx = 0;
        if(idx >= interior.length) idx = interior.length - 1;
        while(usedIdx.has(idx)) idx = (idx + 1) % interior.length;
        usedIdx.add(idx);
        const cell = interior[idx];
        map[cell.y][cell.x] = 3;
        doors.push({ x: cell.x, y: cell.y, q: pool[qOrder[i]] });
    }
}


/* ---------- SPELFLÖDE ---------- */

function startLevel(){
    const cfg = levels[level - 1];
    generateMaze();
    placeDoors(cfg.doors, cfg.pool);
    lives = START_LIVES;
    running = true;
    gameWon = false;
    gameOver = false;
    levelCleared = false;
    questionActive = false;
    currentDoor = null;
    currentQuestion = null;
    questionBox.classList.remove("show");
    announceLevelStart();
}

function startNewGame(){
    level = 1;
    feedback = "";
    startLevel();
}

function nextLevel(){
    level++;
    startLevel();
}

function setFeedback(text, color){
    feedback = text;
    feedbackColor = color;
    feedbackUntil = Date.now() + 1800;
}

function showQuestion(door){
    questionActive = true;
    running = false;
    currentDoor = door;
    currentQuestion = door.q;
    questionText.textContent = currentQuestion.question;
    answer0.textContent = currentQuestion.answers[0];
    answer1.textContent = currentQuestion.answers[1];
    answer2.textContent = currentQuestion.answers[2];
    questionBox.classList.add("show");
    speakQuestion(currentQuestion);
}

function handleAnswer(selected){
    if(selected === currentQuestion.correct){
        map[currentDoor.y][currentDoor.x] = 0;
        doors = doors.filter(d => !(d.x === currentDoor.x && d.y === currentDoor.y));
        setFeedback("✅ Rätt! Porten öppnas.", "lime");
        speak("Rätt svar! Porten öppnas.");
    } else {
        lives--;
        setFeedback("❌ Fel svar! Försök igen.", "red");
        if(lives <= 0){
            gameOver = true;
            setFeedback("💀 Slut på liv!", "red");
            speak("Fel svar. Slut på liv. Tryck mellanslag för att börja om.");
        } else {
            speak("Fel svar. Försök igen. Du har " + lives + " liv kvar.");
        }
    }
    questionBox.classList.remove("show");
    questionActive = false;
    running = !gameOver;

    // Säg nästa vägledning efter återkopplingen (läggs i kö, avbryter inte).
    if(running){
        const ins = computeInstruction();
        if(ins) speakRaw(ins, false);
    }
}

function moveStep(mx, my){
    if(!running || questionActive || gameWon || gameOver || levelCleared) return;
    const nx = player.x + mx;
    const ny = player.y + my;
    if(nx < 0 || ny < 0 || nx >= cols || ny >= rows) return;

    const cell = map[ny][nx];
    if(cell === 1) return;
    if(cell === 3){
        const door = doors.find(d => d.x === nx && d.y === ny);
        if(door) showQuestion(door);
        return;
    }

    player.x = nx;
    player.y = ny;

    if(player.x === exit.x && player.y === exit.y){
        running = false;
        if(level < levels.length){
            levelCleared = true;
            setFeedback("🎉 Nivå " + level + " klar!", "lime");
            speak("Nivå " + level + " klar! Bra jobbat! Tryck mellanslag för nästa nivå.");
        } else {
            gameWon = true;
            setFeedback("🏆 Du klarade alla nivåer!", "gold");
            speak("Fantastiskt! Du klarade alla nivåer! Tryck mellanslag för nytt spel.");
        }
    } else {
        announceGuidance();
    }
}

        if(document.exitFullscreen){

document.addEventListener("fullscreenchange", ()=>{
    fsBtn.textContent = document.fullscreenElement ? "🖥️ Avsluta helskärm" : "🖥️ Helskärm";
});


/* ---------- TANGENTER (MakeyMakey) ---------- */

document.addEventListener("keydown",(e)=>{

    if(e.repeat) return;                 // ett steg / en handling per tryck
    const key = e.key;

    // M = slå på/av rösten (när som helst)
    if(key === "m" || key === "M"){ toggleVoice(); return; }

    // Allra första tangenttrycket "väcker" ljudet (krav i webbläsare).
    // Det trycket säger nivå + första vägbeskrivning, men flyttar inte spelaren.
    if(!primed){
        primed = true;
        e.preventDefault();
        announceLevelStart();
        return;
    }

    // Under en fråga: ⬆️ ⬇️ ␣ = svar, ➡️ eller ⬅️ = hör frågan igen
    if(questionActive){
        if(key === "ArrowRight" || key === "ArrowLeft"){
            e.preventDefault(); repeatQuestion(); return;
        }
        let selected = -1;
        if(key === "ArrowUp") selected = 0;
        else if(key === "ArrowDown") selected = 1;
        else if(key === " ") selected = 2;
        if(selected !== -1){ e.preventDefault(); handleAnswer(selected); }
        return;
    }

    // Nivå klar: mellanslag = nästa nivå
    if(levelCleared){
        if(key === " "){ e.preventDefault(); nextLevel(); }
        return;
    }

    // Vinst / förlust: mellanslag = nytt spel
    if(gameWon || gameOver){
        if(key === " "){ e.preventDefault(); startNewGame(); }
        return;
    }

    // R = upprepa vägbeskrivningen under vandring
    if(key === "r" || key === "R" || key === "Enter"){
        e.preventDefault(); announceGuidance(); return;
    }

    // Normal rörelse
    if(key === " "){ e.preventDefault(); startNewGame(); return; }
    if(key === "ArrowUp"){ e.preventDefault(); moveStep(0, -1); }
    else if(key === "ArrowDown"){ e.preventDefault(); moveStep(0, 1); }
    else if(key === "ArrowLeft"){ e.preventDefault(); moveStep(-1, 0); }
    else if(key === "ArrowRight"){ e.preventDefault(); moveStep(1, 0); }
});


/* ---------- RITNING ---------- */

function draw(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for(let y = 0; y < rows; y++){
        for(let x = 0; x < cols; x++){
            if(map[y][x] === 1){
                ctx.fillStyle = "blue";
                ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
            }
            if(map[y][x] === 3){
                ctx.fillStyle = "brown";
                ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
                ctx.fillStyle = "white";
                ctx.font = "14px Arial";
                ctx.fillText("?", x * tileSize + 6, y * tileSize + 15);
            }
        }
    }

    ctx.fillStyle = "lime";
    ctx.fillRect(exit.x * tileSize, exit.y * tileSize, tileSize, tileSize);

    ctx.fillStyle = "orange";
    ctx.beginPath();
    ctx.arc(
        player.x * tileSize + tileSize / 2,
        player.y * tileSize + tileSize / 2,
        tileSize / 2 - 2, 0, Math.PI * 2
    );
    ctx.fill();

    drawMessages();
    updateHud();
}

function drawMessages(){
    if(gameWon || gameOver || levelCleared){
        ctx.fillStyle = "rgba(0,0,0,0.8)";
        ctx.fillRect(0, 140, canvas.width, 120);
    }
    ctx.textAlign = "center";

    if(levelCleared){
        ctx.fillStyle = "lime";
        ctx.font = "26px Arial";
        ctx.fillText("🎉 Nivå " + level + " klar!", canvas.width / 2, 180);
        ctx.fillStyle = "white";
        ctx.font = "16px Arial";
        ctx.fillText("Nu blir det svårare!", canvas.width / 2, 210);
        ctx.fillText("Tryck mellanslag för nästa nivå", canvas.width / 2, 235);
    }
    if(gameWon){
        ctx.fillStyle = "gold";
        ctx.font = "28px Arial";
        ctx.fillText("🏆 DU VANN!", canvas.width / 2, 180);
        ctx.fillStyle = "white";
        ctx.font = "16px Arial";
        ctx.fillText("Du klarade alla tre nivåerna!", canvas.width / 2, 210);
        ctx.fillText("Tryck mellanslag för nytt spel", canvas.width / 2, 235);
    }
    if(gameOver){
        ctx.fillStyle = "red";
        ctx.font = "28px Arial";
        ctx.fillText("💀 GAME OVER", canvas.width / 2, 180);
        ctx.fillStyle = "white";
        ctx.font = "16px Arial";
        ctx.fillText("Tryck mellanslag för att börja om", canvas.width / 2, 220);
    }
    ctx.textAlign = "left";
}

function updateHud(){
    levelEl.textContent = level;
    levelNameEl.textContent = levels[level - 1].name;
    livesEl.textContent = lives;
    doorsEl.textContent = doors.length;
    feedbackEl.textContent = feedback;
    feedbackEl.style.color = feedbackColor;
}

function gameLoop(){
    if(feedback && Date.now() > feedbackUntil && !gameWon && !gameOver && !levelCleared){
        feedback = "";
    }
    draw();
    requestAnimationFrame(gameLoop);
}

startNewGame();
gameLoop();

</script>
