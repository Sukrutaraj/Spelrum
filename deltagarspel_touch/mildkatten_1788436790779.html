<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mild Katten v5 – funktionstest</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f2ead8;color:#243247;
  touch-action:manipulation;
  display:flex;flex-direction:column;
}
header{
  height:78px;flex:0 0 78px;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 22px;background:#315b4a;color:white;
}
h1{margin:0;font-size:clamp(24px,3vw,38px)}
.controls{display:flex;gap:10px}
button{
  border:0;border-radius:14px;background:white;color:#243247;
  font-size:clamp(16px,1.7vw,22px);font-weight:800;
  padding:11px 18px;min-height:50px;cursor:pointer;
  box-shadow:0 3px 8px rgba(0,0,0,.16)
}
button:active{transform:scale(.97)}
#main{
  flex:1;display:flex;flex-direction:column;
  min-height:0;padding:12px 16px 10px;gap:9px
}
#task{
  width:min(1300px,96vw);margin:0 auto;
  display:flex;align-items:center;justify-content:center;gap:16px;
  min-height:58px;
  background:white;border-radius:18px;
  box-shadow:0 3px 10px rgba(0,0,0,.12);
  font-size:clamp(20px,2.3vw,31px);font-weight:800
}
#target{font-size:clamp(35px,4vw,52px)}
#boardWrap{
  flex:1;min-height:0;
  width:min(1300px,96vw);margin:0 auto;
  position:relative;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,.20);
  background:#d9c59b
}
#board{
  position:absolute;inset:0;
  background:
    radial-gradient(circle at 20% 25%,rgba(255,255,255,.28) 0 3%,transparent 3.5%),
    radial-gradient(circle at 75% 70%,rgba(255,255,255,.18) 0 4%,transparent 4.5%),
    linear-gradient(135deg,#d9c59b,#e8d9b9);
}
.item{
  position:absolute;
  width:clamp(54px,7vw,92px);
  height:clamp(54px,7vw,92px);
  border-radius:22%;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(36px,4.5vw,65px);
  background:rgba(255,255,255,.66);
  border:3px solid rgba(60,70,60,.10);
  box-shadow:0 4px 8px rgba(0,0,0,.14);
  cursor:pointer;
  user-select:none;
  transition:transform .13s,box-shadow .13s;
}
.item:hover{transform:scale(1.05)}
.item:active{transform:scale(.92)}
.item.correct{
  border-color:#3d9b62;
  box-shadow:0 0 0 6px rgba(61,155,98,.24),0 6px 12px rgba(0,0,0,.18)
}
.item.wrong{
  animation:shake .25s linear;
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-9px)}
  75%{transform:translateX(9px)}
}
#bottom{
  width:min(1300px,96vw);margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  min-height:50px
}
#feedback{
  flex:1;text-align:center;font-size:clamp(16px,1.7vw,22px);font-weight:700
}
#next{
  background:#ffd45a;display:none
}
#score{
  min-width:110px;text-align:center;
  background:white;border-radius:14px;padding:11px 15px;
  font-size:clamp(16px,1.5vw,20px);font-weight:800;
  box-shadow:0 3px 8px rgba(0,0,0,.12)
}
@media(max-width:700px){
 header{height:64px;flex-basis:64px;padding:7px 10px}
 header button{min-height:44px;padding:8px 12px}
 #main{padding:8px;gap:7px}
 #task{min-height:50px;border-radius:14px}
 #boardWrap{border-radius:18px}
 .item{width:48px;height:48px;font-size:30px}
 #bottom{min-height:44px}
 #score{min-width:80px;padding:8px}
}

#setup{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}#setup h2{margin:0;font-size:32px}#setup button{min-width:70px;min-height:58px;font-size:22px}
#game{display:none;position:relative;flex:1;height:calc(100vh - 78px)}#table{position:absolute;inset:0}
#centerWrap{position:absolute;width:min(48vw,600px);height:min(48vw,600px);min-width:300px;min-height:300px;left:50%;top:50%;transform:translate(-50%,-50%);border:4px solid #222;border-radius:50%;background:#eee;box-shadow:0 5px 18px rgba(0,0,0,.16);overflow:hidden}
#center{position:absolute;inset:3%;border-radius:50%}.centerCard{position:absolute;width:clamp(42px,4.8vw,70px);height:clamp(42px,4.8vw,70px);border:0;border-radius:14px;background:white;font-size:clamp(27px,3.2vw,46px);box-shadow:0 3px 7px rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;user-select:none;}.centerCard.claimed{box-shadow:0 0 0 5px rgba(61,155,98,.32),0 0 20px rgba(61,155,98,.55);background:#eaffef}
.playerArea{position:absolute;width:min(25vw,270px);min-width:145px;padding:8px 10px;border-radius:16px;background:rgba(255,255,255,.85);box-shadow:0 3px 10px rgba(0,0,0,.10)}.playerArea h3{margin:0 0 7px;font-size:18px}.hand{position:relative;min-height:82px}.handCard{position:absolute;width:clamp(48px,5vw,68px);height:clamp(48px,5vw,68px);border:0;border-radius:14px;background:white;font-size:clamp(30px,3.4vw,46px);box-shadow:0 3px 8px rgba(0,0,0,.18);cursor:grab;touch-action:none;user-select:none}.handCard.locked{opacity:.35;pointer-events:none}.playerArea.p1{left:4%;top:4%}.playerArea.p2{right:4%;top:4%}.playerArea.p3{right:4%;bottom:4%}.playerArea.p4{left:4%;bottom:4%}
#status{position:absolute;left:50%;top:calc(50% + min(26vw,330px));transform:translateX(-50%);text-align:center;font-weight:800;font-size:18px;background:white;border-radius:12px;padding:7px 14px;box-shadow:0 2px 7px rgba(0,0,0,.1);z-index:20}#newRound{position:absolute;right:18px;bottom:14px;display:none;background:#ffd45a}.dragGhost{position:fixed!important;z-index:9999!important;pointer-events:none!important;opacity:.9}
@media(max-width:700px){#game{height:calc(100vh - 64px)}#centerWrap{width:52vw;height:52vw;min-width:250px;min-height:250px}.playerArea{width:29vw;min-width:110px;padding:5px}.hand{min-height:65px}.handCard{width:43px;height:43px;font-size:29px}.playerArea.p1{left:2%;top:2%}.playerArea.p2{right:2%;top:2%}.playerArea.p3{right:2%;bottom:2%}.playerArea.p4{left:2%;bottom:2%}}

#setup input{width:150px;padding:12px;border:2px solid #ccc;border-radius:12px;font-size:18px;font-weight:700;text-align:center}
#nameArea{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:800px}
#levelArea{display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap}
#levelArea button.active{background:#315b4a;color:white}
#startGame{background:#ffd45a}
.centerCard{pointer-events:auto;cursor:grab;touch-action:none;user-select:none}
.centerCard.dragging{opacity:.7;box-shadow:0 8px 18px rgba(0,0,0,.28);z-index:9999}
.centerCard.claimed{pointer-events:none}
#winnerOverlay{display:none;position:fixed;inset:0;z-index:5000;background:rgba(255,255,255,.92);align-items:center;justify-content:center;flex-direction:column;text-align:center}
#winnerOverlay .small{font-size:34px;font-weight:900}
#winnerName{font-size:clamp(60px,10vw,130px);font-weight:900;color:#315b4a;margin:8px 0}
#winnerOverlay .wintext{font-size:38px;font-weight:900}
#confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.conf{position:absolute;top:-40px;animation:fall 2.7s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
</style>
</head>
<body>
<header><h1>🐱 Mildkatten</h1><div style="font-size:14px;font-weight:700;opacity:.78">Kolla noga, hitta, flytta och var snabbast.</div><div class="controls"><button id="newGame">Ny omgång</button></div></header>
<main id="main" style="padding:0;gap:0">
<div id="setup">
<h2>Hur många spelar?</h2>
<div class="playerChoices"><button data-p="1">👤 1</button><button data-p="2">👥 2</button><button data-p="3">👥 3</button><button data-p="4">👥 4</button></div>
<div id="nameArea"></div>
<div id="levelArea"><strong>Nivå:</strong><button data-l="1" class="active">1</button><button data-l="2">2</button><button data-l="3">3</button><button data-l="4">4</button></div>
<button id="startGame">▶️ Starta spelet</button>
</div>
<div id="game"><div id="table"><div id="centerWrap"><div id="center"></div></div><div id="players"></div><div id="status">Alla spelar samtidigt.</div><button id="newRound">Nästa omgång →</button></div></div>
</main>
<div id="winnerOverlay"><div id="confetti"></div><div class="small">🎉 GRATTIS!</div><div id="winnerName"></div><div class="wintext">DU VANN MILDKATTEN! 🐱</div><button id="winnerAgain" style="margin-top:24px;background:#ffd45a">Spela igen</button></div>

<script>
"use strict";
const fam=[["🍎","🍏"],["🚗","🚕","🚙"],["🐶","🐕","🦮"],["🌸","🌹","🌺"],["⭐","🌟","✨"],["🐟","🐠","🐡"],["🍌","🍐"],["🎸","🎻","🎷"],["🏠","🏡"],["🎁","🎀"],["🦋","🐝"],["☀️","🌞"],["🍕","🍔"],["🐸","🐢"],["🚂","🚆"],["👑","💎"],["☕","🥤"],["🔑","🗝️"],["⚽","🏀"],["🍓","🍒"],["🐱","😺"],["🌻","🌼","🌷"],["🎈","🎉"],["👓","🕶️"],["🍦","🍨"],["🚲","🛴"],["📚","📖"],["🎵","🎶"],["🧸","🪀"],["🚀","🛸"],["🍩","🍪"],["🥕","🌽"],["🐼","🐨"],["🦁","🐯"],["🐙","🦑"],["🧁","🍰"]];
const levels={1:{hand:6,dec:18},2:{hand:8,dec:24},3:{hand:10,dec:32},4:{hand:12,dec:40}};
let pc=0,level=1,names=[],hands=[],over=false;
const setup=document.getElementById("setup"),game=document.getElementById("game"),nameArea=document.getElementById("nameArea"),center=document.getElementById("center"),players=document.getElementById("players"),status=document.getElementById("status"),next=document.getElementById("newRound"),winner=document.getElementById("winnerOverlay"),winnerName=document.getElementById("winnerName");
function sh(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pickPlayers(n){pc=n;nameArea.innerHTML="";for(let i=0;i<n;i++){let x=document.createElement("input");x.placeholder="Spelare "+(i+1);x.maxLength=18;nameArea.appendChild(x)}}
document.querySelectorAll("[data-p]").forEach(x=>x.onclick=()=>pickPlayers(+x.dataset.p));
document.querySelectorAll("[data-l]").forEach(x=>x.onclick=()=>{document.querySelectorAll("[data-l]").forEach(y=>y.classList.remove("active"));x.classList.add("active");level=+x.dataset.l});
document.getElementById("startGame").onclick=()=>{if(!pc)return;names=[...nameArea.querySelectorAll("input")].map((x,i)=>x.value.trim()||"Spelare "+(i+1));setup.style.display="none";game.style.display="block";make()};
document.getElementById("newGame").onclick=()=>{game.style.display="none";setup.style.display="flex";next.style.display="none";winner.style.display="none"};
next.onclick=make;document.getElementById("winnerAgain").onclick=()=>{winner.style.display="none";make()};

function make(){
 over=false;center.innerHTML="";players.innerHTML="";next.style.display="none";hands=[];
 const cfg=levels[level],chosen=sh(fam).slice(0,pc*cfg.hand),targets=[];
 for(let p=0;p<pc;p++){hands[p]=[];for(let i=0;i<cfg.hand;i++){let f=chosen[p*cfg.hand+i],id=p+"-"+i;hands[p].push({id,icon:f[0],done:false});targets.push({id,icon:f[0]})}}
 let pool=targets.map(x=>({...x,claim:1})),d=sh(fam);
 for(let i=0;i<cfg.dec;i++){let f=d[i%d.length];pool.push({icon:f[1]||f[0],claim:0})}
 sh(pool).forEach((x,i)=>{let e=document.createElement("div");e.className="centerCard";e.textContent=x.icon;e.dataset.id=x.id||"";e.dataset.claim=x.claim;e.dataset.claimed="0";let a=Math.random()*6.283,r=Math.sqrt(Math.random())*40;e.style.left=(50+Math.cos(a)*r)+"%";e.style.top=(50+Math.sin(a)*r)+"%";e.style.transform="translate(-50%,-50%) rotate("+Math.round(Math.random()*110-55)+"deg)";e.style.zIndex=100+i;center.appendChild(e);centerDrag(e)});
 renderPlayers();status.textContent="Alla spelar samtidigt – kolla noga, flytta och hitta!";
}
function renderPlayers(){
 const cfg=levels[level];
 for(let p=0;p<pc;p++){let box=document.createElement("div");box.className="playerArea p"+(p+1);box.dataset.p=p;let h=document.createElement("h3");h.textContent=names[p]+" · "+hands[p].filter(x=>!x.done).length+" kvar";let hand=document.createElement("div");hand.className="hand";box.append(h,hand);players.appendChild(box);
 hands[p].forEach((c,i)=>{let e=document.createElement("button");e.className="handCard";e.type="button";e.textContent=c.icon;e.dataset.id=c.id;e.dataset.p=p;e.style.left=(i%4)*48+"px";e.style.top=Math.floor(i/4)*48+"px";drag(e,c,hand);hand.appendChild(e)})}
}
function centerDrag(el){
 let g=null,ox=0,oy=0,moved=false;
 el.onpointerdown=e=>{if(el.dataset.claimed==="1")return;e.preventDefault();el.setPointerCapture(e.pointerId);let r=el.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;g=el.cloneNode(true);g.className="centerCard dragGhost";g.style.width=r.width+"px";g.style.height=r.height+"px";document.body.appendChild(g);moved=false;el.classList.add("dragging");move(e)};
 el.onpointermove=e=>{if(g){moved=true;move(e)}};
 el.onpointerup=e=>{if(!g)return;move(e);g.remove();g=null;el.classList.remove("dragging");if(!moved)return;let r=document.getElementById("centerWrap").getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,dx=x-r.width/2,dy=y-r.height/2,max=r.width/2-el.offsetWidth*.75,len=Math.hypot(dx,dy)||1;if(len>max){x=r.width/2+dx/len*max;y=r.height/2+dy/len*max}el.style.left=x/r.width*100+"%";el.style.top=y/r.height*100+"%";status.textContent="🖐️ Flytta bilderna som du vill."};
 el.onpointercancel=()=>{if(g){g.remove();g=null}el.classList.remove("dragging")};
 function move(e){g.style.left=e.clientX-ox+"px";g.style.top=e.clientY-oy+"px"}
}
function drag(el,c,hand){
 let g=null,ox=0,oy=0,moved=false;
 el.onpointerdown=e=>{if(c.done)return;e.preventDefault();el.setPointerCapture(e.pointerId);let r=el.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;g=el.cloneNode(true);g.className="handCard dragGhost";g.style.width=r.width+"px";g.style.height=r.height+"px";document.body.appendChild(g);moved=false;move(e)};
 el.onpointermove=e=>{if(g){moved=true;move(e)}};
 el.onpointerup=e=>{if(!g)return;move(e);let hit=document.elementsFromPoint(e.clientX,e.clientY).find(x=>x.classList&&x.classList.contains("centerCard")&&x.dataset.claimed!=="1");g.remove();g=null;if(!moved)return;
   if(hit&&hit.dataset.claim==="1"&&hit.dataset.id===c.id){hit.classList.add("claimed");playHit();c.done=true;el.remove();let p=+el.dataset.p,box=hand.closest(".playerArea");box.querySelector("h3").textContent=names[p]+" · "+hands[p].filter(x=>!x.done).length+" kvar";status.textContent="✨ Rätt!";setTimeout(()=>hit.remove(),180);if(hands[p].every(x=>x.done))showWinner(p)}
   else{let r=hand.getBoundingClientRect(),l=Math.max(0,Math.min(r.width-el.offsetWidth,e.clientX-r.left-ox)),t=Math.max(0,Math.min(r.height-el.offsetHeight,e.clientY-r.top-oy));el.style.left=l+"px";el.style.top=t+"px";status.textContent="👀 Inte rätt – fortsätt leta."}
 };
 el.onpointercancel=()=>{if(g){g.remove();g=null}};
 function move(e){g.style.left=e.clientX-ox+"px";g.style.top=e.clientY-oy+"px"}
}

function playHit(){
  // Kort, mjuk bekräftelse – tydlig nog att märkas men diskret nog för flera spelare.
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C)return;
    const ctx=new C();
    const g=ctx.createGain();
    const o=ctx.createOscillator();
    o.type="sine";
    o.frequency.setValueAtTime(660,ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(880,ctx.currentTime+0.07);
    g.gain.setValueAtTime(0.0001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.055,ctx.currentTime+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.14);
    o.connect(g);g.connect(ctx.destination);
    o.start();o.stop(ctx.currentTime+0.15);
    setTimeout(()=>{try{ctx.close()}catch(e){}},220);
  }catch(e){}
}

function showWinner(p){
 if(over)return;over=true;status.textContent="🎉 "+names[p]+" blev klar först!";winnerName.textContent=names[p];winner.style.display="flex";confetti();cheer();
}
function confetti(){let c=document.getElementById("confetti");c.innerHTML="";for(let i=0;i<80;i++){let x=document.createElement("div");x.className="conf";x.textContent=Math.random()<.5?"🎉":"⭐";x.style.left=Math.random()*100+"%";x.style.fontSize=(14+Math.random()*24)+"px";x.style.animationDelay=Math.random()+"s";c.appendChild(x)}}
function cheer(){try{let C=new AudioContext(),o=C.createOscillator(),g=C.createGain();o.type="triangle";o.connect(g);g.connect(C.destination);let t=C.currentTime;[523,659,784,1047].forEach((f,i)=>o.frequency.setValueAtTime(f,t+i*.12));g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.8);o.start(t);o.stop(t+.85)}catch(e){}}
</script>
</body>
</html>
