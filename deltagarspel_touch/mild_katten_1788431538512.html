<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mild Katten v5 – funktionstest</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f2ead8;color:#243247;
  touch-action:manipulation;
  display:flex;flex-direction:column;
}
header{
  height:78px;flex:0 0 78px;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 22px;background:#315b4a;color:white;
}
h1{margin:0;font-size:clamp(24px,3vw,38px)}
.controls{display:flex;gap:10px}
button{
  border:0;border-radius:14px;background:white;color:#243247;
  font-size:clamp(16px,1.7vw,22px);font-weight:800;
  padding:11px 18px;min-height:50px;cursor:pointer;
  box-shadow:0 3px 8px rgba(0,0,0,.16)
}
button:active{transform:scale(.97)}
#main{
  flex:1;display:flex;flex-direction:column;
  min-height:0;padding:12px 16px 10px;gap:9px
}
#task{
  width:min(1300px,96vw);margin:0 auto;
  display:flex;align-items:center;justify-content:center;gap:16px;
  min-height:58px;
  background:white;border-radius:18px;
  box-shadow:0 3px 10px rgba(0,0,0,.12);
  font-size:clamp(20px,2.3vw,31px);font-weight:800
}
#target{font-size:clamp(35px,4vw,52px)}
#boardWrap{
  flex:1;min-height:0;
  width:min(1300px,96vw);margin:0 auto;
  position:relative;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,.20);
  background:#d9c59b
}
#board{
  position:absolute;inset:0;
  background:
    radial-gradient(circle at 20% 25%,rgba(255,255,255,.28) 0 3%,transparent 3.5%),
    radial-gradient(circle at 75% 70%,rgba(255,255,255,.18) 0 4%,transparent 4.5%),
    linear-gradient(135deg,#d9c59b,#e8d9b9);
}
.item{
  position:absolute;
  width:clamp(54px,7vw,92px);
  height:clamp(54px,7vw,92px);
  border-radius:22%;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(36px,4.5vw,65px);
  background:rgba(255,255,255,.66);
  border:3px solid rgba(60,70,60,.10);
  box-shadow:0 4px 8px rgba(0,0,0,.14);
  cursor:pointer;
  user-select:none;
  transition:transform .13s,box-shadow .13s;
}
.item:hover{transform:scale(1.05)}
.item:active{transform:scale(.92)}
.item.correct{
  border-color:#3d9b62;
  box-shadow:0 0 0 6px rgba(61,155,98,.24),0 6px 12px rgba(0,0,0,.18)
}
.item.wrong{
  animation:shake .25s linear;
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-9px)}
  75%{transform:translateX(9px)}
}
#bottom{
  width:min(1300px,96vw);margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  min-height:50px
}
#feedback{
  flex:1;text-align:center;font-size:clamp(16px,1.7vw,22px);font-weight:700
}
#next{
  background:#ffd45a;display:none
}
#score{
  min-width:110px;text-align:center;
  background:white;border-radius:14px;padding:11px 15px;
  font-size:clamp(16px,1.5vw,20px);font-weight:800;
  box-shadow:0 3px 8px rgba(0,0,0,.12)
}
@media(max-width:700px){
 header{height:64px;flex-basis:64px;padding:7px 10px}
 header button{min-height:44px;padding:8px 12px}
 #main{padding:8px;gap:7px}
 #task{min-height:50px;border-radius:14px}
 #boardWrap{border-radius:18px}
 .item{width:48px;height:48px;font-size:30px}
 #bottom{min-height:44px}
 #score{min-width:80px;padding:8px}
}

#setup{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}#setup h2{margin:0;font-size:32px}#setup button{min-width:70px;min-height:58px;font-size:22px}
#game{display:none;position:relative;flex:1;height:calc(100vh - 78px)}#table{position:absolute;inset:0}
#centerWrap{position:absolute;width:min(48vw,600px);height:min(48vw,600px);min-width:300px;min-height:300px;left:50%;top:50%;transform:translate(-50%,-50%);border:4px solid #222;border-radius:50%;background:#eee;box-shadow:0 5px 18px rgba(0,0,0,.16);overflow:hidden}
#center{position:absolute;inset:3%;border-radius:50%}.centerCard{position:absolute;width:clamp(42px,4.8vw,70px);height:clamp(42px,4.8vw,70px);border:0;border-radius:14px;background:white;font-size:clamp(27px,3.2vw,46px);box-shadow:0 3px 7px rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;user-select:none;}.centerCard.claimed{box-shadow:0 0 0 5px rgba(61,155,98,.32),0 0 20px rgba(61,155,98,.55);background:#eaffef}
.playerArea{position:absolute;width:min(25vw,270px);min-width:145px;padding:8px 10px;border-radius:16px;background:rgba(255,255,255,.85);box-shadow:0 3px 10px rgba(0,0,0,.10)}.playerArea h3{margin:0 0 7px;font-size:18px}.hand{position:relative;min-height:82px}.handCard{position:absolute;width:clamp(48px,5vw,68px);height:clamp(48px,5vw,68px);border:0;border-radius:14px;background:white;font-size:clamp(30px,3.4vw,46px);box-shadow:0 3px 8px rgba(0,0,0,.18);cursor:grab;touch-action:none;user-select:none}.handCard.locked{opacity:.35;pointer-events:none}.playerArea.p1{left:4%;top:4%}.playerArea.p2{right:4%;top:4%}.playerArea.p3{right:4%;bottom:4%}.playerArea.p4{left:4%;bottom:4%}
#status{position:absolute;left:50%;top:calc(50% + min(26vw,330px));transform:translateX(-50%);text-align:center;font-weight:800;font-size:18px;background:white;border-radius:12px;padding:7px 14px;box-shadow:0 2px 7px rgba(0,0,0,.1);z-index:20}#newRound{position:absolute;right:18px;bottom:14px;display:none;background:#ffd45a}.dragGhost{position:fixed!important;z-index:9999!important;pointer-events:none!important;opacity:.9}
@media(max-width:700px){#game{height:calc(100vh - 64px)}#centerWrap{width:52vw;height:52vw;min-width:250px;min-height:250px}.playerArea{width:29vw;min-width:110px;padding:5px}.hand{min-height:65px}.handCard{width:43px;height:43px;font-size:29px}.playerArea.p1{left:2%;top:2%}.playerArea.p2{right:2%;top:2%}.playerArea.p3{right:2%;bottom:2%}.playerArea.p4{left:2%;bottom:2%}}
</style>
</head>
<body>
<header><h1>🐱 Mild Katten – funktionstest</h1><div class="controls"><button id="newGame">Ny omgång</button></div></header>
<main id="main" style="padding:0;gap:0">
<div id="setup"><h2>Hur många spelar?</h2><div><button data-p="1">👤 1</button><button data-p="2">👥 2</button><button data-p="3">👥 3</button><button data-p="4">👥 4</button></div></div>
<div id="game"><div id="table"><div id="centerWrap"><div id="center"></div></div><div id="players"></div><div id="status">Alla spelar samtidigt.</div><button id="newRound">Nästa omgång →</button></div></div>
</main>
<script>
"use strict";
const fam=[["🍎","🍏"],["🚗","🚕","🚙"],["🐶","🐕","🦮"],["🌸","🌹","🌺"],["⭐","🌟"],["🐟","🐠"],["🍌","🍐"],["🎸","🎻","🎷"],["🏠","🏡"],["🎁","🎀"],["🦋","🐝"],["☀️","🌞"],["🍕","🍔"],["🐸","🐢"],["🚂","🚆"],["👑","💎"],["☕","🥤"],["🔑","🗝️"],["⚽","🏀"],["🍓","🍒"],["🐱","😺"],["🌻","🌼"],["🎈","🎉"],["👓","🕶️"],["🍦","🍨"],["🚲","🛴"],["📚","📖"],["🎵","🎶"],["🧸","🪀"],["🚀","🛸"]];
let n=0,hands=[],round=0;
const setup=document.getElementById("setup"),game=document.getElementById("game"),center=document.getElementById("center"),players=document.getElementById("players"),status=document.getElementById("status"),next=document.getElementById("newRound");
const sh=a=>{a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{n=+b.dataset.p;setup.style.display="none";game.style.display="block";round=0;make()});
document.getElementById("newGame").onclick=()=>{game.style.display="none";setup.style.display="flex";next.style.display="none"};
next.onclick=make;

function make(){
 round++;center.innerHTML="";players.innerHTML="";next.style.display="none";hands=[];let chosen=sh(fam).slice(0,n*6),targets=[];
 for(let p=0;p<n;p++){hands[p]=[];for(let i=0;i<6;i++){let f=chosen[p*6+i],id=p+"-"+i;hands[p].push({id,icon:f[0],done:false});targets.push({id,icon:f[0],family:f})}}
 let pool=targets.map(x=>({...x,claim:true}));
 let dec=sh(fam);for(let i=0;i<18;i++){let f=dec[i%dec.length],x=f[1]||f[0];pool.push({icon:x,claim:false})}
 sh(pool).forEach((x,i)=>{
   const e=document.createElement("div");
   e.className="centerCard";
   e.textContent=x.icon;
   e.dataset.id=x.id||"";
   e.dataset.claim=x.claim?"1":"0";
   e.dataset.claimed="0";

   // Static layered pile: cards stay where they are. Some are deliberately
   // covered by other cards and are revealed when the top card is removed.
   const angle=Math.random()*Math.PI*2;
   const radius=Math.sqrt(Math.random())*39;
   e.style.left=(50+Math.cos(angle)*radius)+"%";
   e.style.top=(50+Math.sin(angle)*radius)+"%";
   e.style.transform="translate(-50%,-50%) rotate("+Math.round(Math.random()*110-55)+"deg)";
   e.style.zIndex=100+i;
   center.appendChild(e);
 }); for(let p=0;p<n;p++){let box=document.createElement("div");box.className="playerArea p"+(p+1);box.dataset.p=p;let h=document.createElement("h3");h.textContent="SPELARE "+(p+1)+" · 6 kvar";let hand=document.createElement("div");hand.className="hand";box.append(h,hand);players.appendChild(box);hands[p].forEach((c,i)=>{let e=document.createElement("button");e.className="handCard";e.type="button";e.textContent=c.icon;e.dataset.id=c.id;e.dataset.p=p;e.style.left=(i%3)*52+"px";e.style.top=Math.floor(i/3)*48+"px";drag(e,c,hand);hand.appendChild(e)})}
 status.textContent="Alla spelar samtidigt – hitta dina egna bilder!";
}


function drag(el,c,hand){
 let g=null,ox=0,oy=0,moved=false;
 el.onpointerdown=e=>{e.preventDefault();el.setPointerCapture(e.pointerId);let r=el.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;g=el.cloneNode(true);g.className="handCard dragGhost";g.style.width=r.width+"px";g.style.height=r.height+"px";document.body.appendChild(g);moved=false;move(e)};
 el.onpointermove=e=>{if(g){moved=true;move(e)}};
 el.onpointerup=e=>{if(!g)return;move(e);let hit=document.elementsFromPoint(e.clientX,e.clientY).find(x=>x.classList&&x.classList.contains("centerCard"));g.remove();g=null;if(!moved)return;
   if(hit&&hit.dataset.claim==="1"&&hit.dataset.id===c.id){
     hit.classList.add("claimed");
     c.done=true;
     el.remove();
     let box=hand.closest(".playerArea");
     box.querySelector("h3").textContent="SPELARE "+(+el.dataset.p+1)+" · "+hands[+el.dataset.p].filter(x=>!x.done).length+" kvar";
     status.textContent="✨ Rätt! Bilden försvinner och visar vad som finns under.";
     setTimeout(()=>hit.remove(),180);
     if(hands[+el.dataset.p].every(x=>x.done)){
       box.classList.add("done");
       status.textContent="🎉 Spelare "+(+el.dataset.p+1)+" är klar!";
     }
     if(hands.every(x=>x.every(y=>y.done))){
       status.textContent="🎉 Alla är klara!";
       next.style.display="block";
     }
   }else{
     let r=hand.getBoundingClientRect(),l=Math.max(0,Math.min(r.width-el.offsetWidth,e.clientX-r.left-ox)),t=Math.max(0,Math.min(r.height-el.offsetHeight,e.clientY-r.top-oy));
     el.style.left=l+"px";el.style.top=t+"px";
     status.textContent="👀 Inte rätt – fortsätt leta.";
   }
 };
 function move(e){if(g){g.style.left=(e.clientX-ox)+"px";g.style.top=(e.clientY-oy)+"px"}}
}
</script>
</body>
</html>
