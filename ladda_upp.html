<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Lägg till spel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;min-height:100%;background:#0a0a14;
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#f0f0f0;
  display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px;}
body::before{content:'';position:fixed;inset:0;z-index:-1;
  background:radial-gradient(ellipse at 30% 30%,#1a0f30 0%,#0a0a14 70%);}
.page-title{font-size:clamp(22px,4vw,38px);font-weight:900;letter-spacing:3px;
  background:linear-gradient(135deg,#a78bfa,#f0abfc);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:6px;text-align:center;margin-top:10px;}
.page-sub{font-size:13px;color:#444;letter-spacing:2px;text-align:center;margin-bottom:24px;}
.steps{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;justify-content:center;}
.step{background:rgba(167,139,250,0.08);border:1px solid rgba(167,139,250,0.2);
  border-radius:10px;padding:8px 14px;font-size:12px;color:#a78bfa;
  display:flex;align-items:center;gap:6px;}
.step-num{width:20px;height:20px;border-radius:50%;background:rgba(167,139,250,0.3);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
.card{width:100%;max-width:520px;background:rgba(255,255,255,0.04);
  border:1.5px solid rgba(255,255,255,0.08);border-radius:20px;padding:26px 22px;
  display:flex;flex-direction:column;gap:16px;margin-bottom:16px;}
#dropZone{border:2.5px dashed rgba(167,139,250,0.35);border-radius:14px;
  padding:32px 20px;text-align:center;cursor:pointer;transition:all .2s;
  background:rgba(167,139,250,0.04);-webkit-tap-highlight-color:transparent;}
#dropZone:hover,#dropZone.over{border-color:#a78bfa;background:rgba(167,139,250,0.1);}
#dropZone.has-file{border-color:#4ade80;background:rgba(74,222,128,0.06);}
.dz-icon{font-size:38px;margin-bottom:8px;}
.dz-text{font-size:14px;color:#666;line-height:1.6;}
.dz-file{font-size:15px;font-weight:700;color:#4ade80;}
label{font-size:12px;color:#555;letter-spacing:2px;text-transform:uppercase;
  margin-bottom:4px;display:block;}
input[type=text],input[type=password],select{width:100%;
  background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.1);
  border-radius:10px;padding:11px 14px;font-size:15px;color:#f0f0f0;outline:none;
  transition:border-color .15s;font-family:inherit;cursor:pointer;}
input:focus,select:focus{border-color:#a78bfa;}
input[type=file]{display:none;}
.emoji-row{display:flex;gap:8px;flex-wrap:wrap;}
.emoji-btn{width:40px;height:40px;border-radius:10px;
  border:1.5px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);
  font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s;-webkit-tap-highlight-color:transparent;}
.emoji-btn:hover,.emoji-btn.selected{border-color:#a78bfa;
  background:rgba(167,139,250,0.2);transform:scale(1.12);}
.submit-btn{width:100%;padding:14px;font-size:clamp(16px,2.5vw,20px);font-weight:700;
  border:none;border-radius:12px;cursor:pointer;
  background:linear-gradient(135deg,#6d28d9,#a78bfa);color:#fff;letter-spacing:1px;
  transition:filter .15s,transform .1s;-webkit-tap-highlight-color:transparent;}
.submit-btn:hover{filter:brightness(1.15);}
.submit-btn:active{transform:scale(.97);}
.submit-btn:disabled{opacity:0.4;cursor:not-allowed;filter:none;}
#status{width:100%;max-width:520px;border-radius:14px;padding:16px 20px;
  font-size:14px;text-align:center;line-height:1.6;display:none;}
#status.info{background:rgba(96,165,250,0.12);border:1px solid rgba(96,165,250,0.3);color:#60a5fa;}
#status.ok{background:rgba(74,222,128,0.12);border:1px solid rgba(74,222,128,0.3);color:#4ade80;}
#status.err{background:rgba(248,113,113,0.12);border:1px solid rgba(248,113,113,0.3);color:#f87171;}
#progressWrap{display:none;width:100%;max-width:520px;height:6px;
  background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;margin-bottom:8px;}
#progressBar{height:100%;width:0%;background:linear-gradient(90deg,#a78bfa,#f0abfc);
  border-radius:3px;transition:width .3s;}
.back-link{font-size:13px;color:#444;text-decoration:none;
  margin-bottom:16px;align-self:flex-start;transition:color .15s;}
.back-link:hover{color:#a78bfa;}
#successScreen{display:none;flex-direction:column;align-items:center;
  gap:16px;text-align:center;width:100%;max-width:520px;}
.success-icon{font-size:72px;}
.success-title{font-size:clamp(26px,5vw,42px);font-weight:900;
  background:linear-gradient(135deg,#4ade80,#86efac);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.btn-small{font-size:14px;font-weight:700;border:none;border-radius:10px;
  padding:10px 22px;cursor:pointer;transition:filter .15s;}
.btn-green{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;}
.btn-gray{background:rgba(255,255,255,0.1);color:#ccc;border:1px solid rgba(255,255,255,0.15);}
.btn-small:hover{filter:brightness(1.15);}
</style>
</head>
<body>

<a class="back-link" href="index.html">&#8592; Tillbaka till Spelrummet</a>
<div class="page-title">&#127918; LÄGG TILL DITT SPEL</div>
<div class="page-sub">Ditt spel publiceras direkt i Spelrummet</div>

<div class="steps">
  <div class="step"><div class="step-num">1</div>Välj HTML-fil</div>
  <div class="step"><div class="step-num">2</div>Namnge spelet</div>
  <div class="step"><div class="step-num">3</div>Ange lösenord</div>
  <div class="step"><div class="step-num">4</div>Ladda upp!</div>
</div>

<div class="card" id="uploadCard">
  <div>
    <label>DITT SPEL (.HTML-FIL)</label>
    <div id="dropZone" onclick="document.getElementById('fileInput').click()">
      <div class="dz-icon">&#128193;</div>
      <div class="dz-text" id="dzText">
        Tryck här för att välja din HTML-fil<br>
        <span style="font-size:12px;color:#444;">eller dra och släpp filen här</span>
      </div>
    </div>
    <input type="file" id="fileInput" accept=".html,.htm">
  </div>
  <div>
    <label>SPELETS NAMN</label>
    <input type="text" id="gameName" placeholder="T.ex. Mitt rymdeventyr" maxlength="40">
  </div>
  <div>
    <label>VÄLJ EMOJI FÖR DITT SPEL</label>
    <div class="emoji-row" id="emojiRow"></div>
  </div>
  <div>
    <label>KORT BESKRIVNING (valfritt)</label>
    <input type="text" id="gameDesc" placeholder="T.ex. Styr raketen med piltangenterna" maxlength="60">
  </div>
  <div>
    <label>LÄGG I KATEGORI</label>
    <select id="gameCategory">
      <option value="touch">Touchskärm - Deltagarspel</option>
      <option value="makey">MakeyMakey - Deltagarspel</option>
    </select>
  </div>
  <div>
    <label>LÖSENORD</label>
    <input type="password" id="pwdInput" placeholder="Ange lösenordet" maxlength="30">
  </div>
  <button class="submit-btn" id="submitBtn" type="button" onclick="upload()" disabled>
    Ladda upp spelet
  </button>
</div>

<div id="progressWrap"><div id="progressBar"></div></div>
<div id="status"></div>

<div id="successScreen">
  <div class="success-icon">&#127881;</div>
  <div class="success-title">Spelet är uppe!</div>
  <div style="font-size:15px;color:#888;" id="successMsg"></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px;">
    <button class="btn-small btn-green" onclick="location.href='index.html'">Till Spelrummet</button>
    <button class="btn-small btn-gray"  onclick="resetForm()">Ladda upp ett till</button>
  </div>
</div>

<script>
const REPO   = 'sukrutaraj/Spelrum';
const BRANCH = 'main';
const OBF    = [53,7,28,54,5,7,4,118,87,39,44,88,94,22,120,127,6,85,97,40,56,31,63,100,0,104,98,101,42,88,93,87,105,85,3,5,98,1,5,49];
const PWD_HASH = '705';

function decodeToken(pwd){
  return OBF.map(function(b,i){ return String.fromCharCode(b ^ pwd.charCodeAt(i % pwd.length)); }).join('');
}
function checkPwd(pwd){
  var h = String(pwd.split('').reduce(function(a,c){ return a + c.charCodeAt(0); }, 0));
  return h === PWD_HASH;
}

var EMOJIS = ['🎮','🚀','🎯','⚡','🌟','🧩','🎲','🏆','🎪','🎨','🦁','🐉','🤖','👾','🌈','🔥','💎','🎵','🏎️','⚽'];
var selectedEmoji = '🎮';
var selectedFile  = null;
var fileContent   = '';

function buildEmojiPicker(){
  var row = document.getElementById('emojiRow');
  EMOJIS.forEach(function(e){
    var btn = document.createElement('button');
    btn.className = 'emoji-btn' + (e === selectedEmoji ? ' selected' : '');
    btn.textContent = e;
    btn.type = 'button';
    btn.onclick = function(){
      selectedEmoji = e;
      document.querySelectorAll('.emoji-btn').forEach(function(b){ b.classList.remove('selected'); });
      btn.classList.add('selected');
    };
    row.appendChild(btn);
  });
}

document.getElementById('fileInput').addEventListener('change', function(e){
  handleFile(e.target.files[0]);
});

var dz = document.getElementById('dropZone');
dz.addEventListener('dragover',  function(e){ e.preventDefault(); dz.classList.add('over'); });
dz.addEventListener('dragleave', function(){ dz.classList.remove('over'); });
dz.addEventListener('drop', function(e){
  e.preventDefault(); dz.classList.remove('over');
  handleFile(e.dataTransfer.files[0]);
});

function handleFile(file){
  if(!file) return;
  if(!file.name.match(/\.html?$/i)){
    showStatus('err', 'Filen måste vara en .html-fil!');
    return;
  }
  if(file.size > 5 * 1024 * 1024){
    showStatus('err', 'Filen är för stor (max 5MB)');
    return;
  }
  selectedFile = file;
  var reader = new FileReader();
  reader.onload = function(ev){
    fileContent = ev.target.result;
    dz.classList.add('has-file');
    document.getElementById('dzText').innerHTML =
      '<div class="dz-file">Vald: ' + file.name + '</div>' +
      '<div style="font-size:12px;color:#555;margin-top:4px;">' +
      Math.round(file.size/1024) + 'KB - Klar!</div>';
    var nameEl = document.getElementById('gameName');
    if(!nameEl.value){
      nameEl.value = file.name.replace(/\.html?$/i,'').replace(/[-_]/g,' ');
    }
    checkReady();
  };
  reader.readAsText(file, 'utf-8');
}

document.getElementById('gameName').addEventListener('input', checkReady);
document.getElementById('pwdInput').addEventListener('input', checkReady);

function checkReady(){
  var ok = (selectedFile !== null) &&
           (document.getElementById('gameName').value.trim().length > 1) &&
           (document.getElementById('pwdInput').value.length > 2);
  document.getElementById('submitBtn').disabled = !ok;
}

function upload(){
  var name = document.getElementById('gameName').value.trim();
  var desc = document.getElementById('gameDesc').value.trim() || name;
  var pwd  = document.getElementById('pwdInput').value;
  var cat  = document.getElementById('gameCategory').value;

  if(!checkPwd(pwd)){
    showStatus('err', 'Fel lösenord! Försök igen.');
    document.getElementById('pwdInput').value = '';
    document.getElementById('pwdInput').focus();
    return;
  }

  var token = decodeToken(pwd);
  var safeName = name.toLowerCase()
    .replace(/[åä]/g,'a').replace(/ö/g,'o')
    .replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40);
  var ts       = Date.now();
  var filename = safeName + '_' + ts + '.html';
  var folder   = (cat === 'touch') ? 'deltagarspel_touch' : 'deltagarspel_makey';
  var path     = folder + '/' + filename;
  var apiURL   = 'https://api.github.com/repos/' + REPO + '/contents/' + path;

  showStatus('info', 'Laddar upp...');
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('progressBar').style.width    = '25%';
  document.getElementById('submitBtn').disabled = true;

  var b64 = btoa(unescape(encodeURIComponent(fileContent)));
  document.getElementById('progressBar').style.width = '50%';

  fetch(apiURL, {
    method: 'PUT',
    headers: {
      'Authorization': 'token ' + token,
      'Content-Type':  'application/json',
      'Accept':        'application/vnd.github.v3+json'
    },
    body: JSON.stringify({ message: 'Nytt spel: ' + name, content: b64, branch: BRANCH })
  })
  .then(function(res){
    document.getElementById('progressBar').style.width = '75%';
    if(!res.ok) return res.json().then(function(e){ throw new Error(e.message || ('Status ' + res.status)); });
    return res.json();
  })
  .then(function(){
    var meta     = { name:name, emoji:selectedEmoji, desc:desc, file:filename, cat:cat, uploaded:new Date().toISOString() };
    var metaPath = folder + '/meta_' + safeName + '_' + ts + '.json';
    return fetch('https://api.github.com/repos/' + REPO + '/contents/' + metaPath, {
      method: 'PUT',
      headers: {
        'Authorization': 'token ' + token,
        'Content-Type':  'application/json',
        'Accept':        'application/vnd.github.v3+json'
      },
      body: JSON.stringify({ message: 'Meta: ' + name,
        content: btoa(unescape(encodeURIComponent(JSON.stringify(meta)))), branch: BRANCH })
    });
  })
  .then(function(){
    document.getElementById('progressBar').style.width = '100%';
    setTimeout(function(){ document.getElementById('progressWrap').style.display = 'none'; }, 500);
    document.getElementById('uploadCard').style.display  = 'none';
    document.getElementById('status').style.display      = 'none';
    document.getElementById('successScreen').style.display = 'flex';
    document.getElementById('successMsg').textContent =
      selectedEmoji + ' "' + name + '" lades till i ' +
      (cat === 'touch' ? 'Touchskärm' : 'MakeyMakey') + '-spelrummet!';
  })
  .catch(function(e){
    document.getElementById('progressWrap').style.display = 'none';
    document.getElementById('progressBar').style.width    = '0%';
    document.getElementById('submitBtn').disabled = false;
    showStatus('err', 'Uppladdning misslyckades: ' + e.message);
    console.error(e);
  });
}

function showStatus(type, msg){
  var el = document.getElementById('status');
  el.className = type; el.textContent = msg; el.style.display = 'block';
}

function resetForm(){
  selectedFile = null; fileContent = '';
  document.getElementById('uploadCard').style.display      = 'flex';
  document.getElementById('successScreen').style.display   = 'none';
  document.getElementById('fileInput').value  = '';
  document.getElementById('gameName').value   = '';
  document.getElementById('gameDesc').value   = '';
  document.getElementById('pwdInput').value   = '';
  dz.classList.remove('has-file');
  document.getElementById('dzText').innerHTML =
    'Tryck här för att välja din HTML-fil<br>' +
    '<span style="font-size:12px;color:#444;">eller dra och släpp filen här</span>';
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('status').style.display = 'none';
}

buildEmojiPicker();
</script>
</body>
</html>
